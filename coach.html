<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#1f5f3b;color:white;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.status{background:white;color:#1f5f3b;border-radius:14px;padding:14px 18px;font-weight:bold}
</style>
</head>
<body>
<div class="status">Pickleball Coach laden...</div>
<script>
(function(){
  const FIX = `<style id="direct-youtube-compare-fix">
.youtube-panel-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0}.youtube-panel-actions button{margin:0;min-height:46px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center}.youtube-compare-panel{display:block!important;width:100%;box-sizing:border-box;clear:both;margin-top:10px;background:#eef7f1;padding:14px;border-radius:15px;border:1px solid #d2e7db}.youtube-compare-panel .sync-accordion{background:#f7fcf9}.youtube-compare-panel+.video-analyse-sectie{width:100%;box-sizing:border-box}.pwa-debug{display:none!important}
</style>
<script id="direct-youtube-compare-script">
(function(){
  function fixYoutubeComparePanel(){
    var title=document.getElementById('youtubeVideoTitle');
    var youtubeBox=title&&title.closest('.video-box');
    if(!youtubeBox)return false;
    var actionRow=youtubeBox.querySelector('.knopgroep,.youtube-panel-actions');
    if(!actionRow)return false;
    actionRow.classList.add('youtube-panel-actions');
    var compare=document.querySelector('.in-youtube-panel')||document.querySelector('.in-manage-videos')||document.querySelector('.sync-box');
    var analysis=document.querySelector('.video-analyse-sectie');
    if(compare){
      compare.classList.add('youtube-compare-panel','in-youtube-panel');
      compare.classList.remove('in-manage-videos','sync-box');
      actionRow.insertAdjacentElement('afterend',compare);
      var details=compare.querySelector('details');
      if(details)details.open=true;
    }
    if(analysis&&compare){
      compare.insertAdjacentElement('afterend',analysis);
    }
    return !!compare;
  }
  function runFix(){
    fixYoutubeComparePanel();
    var tries=0;
    var timer=setInterval(function(){
      tries++;
      if(fixYoutubeComparePanel()||tries>20)clearInterval(timer);
    },250);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',runFix);
  else runFix();
  window.addEventListener('load',runFix);
})();
<\/script>`;

  fetch('/index.html?raw=' + Date.now(), { cache: 'no-store' })
    .then(function(response){ return response.text(); })
    .then(function(html){
      html = html.replace(/<div id="pwaDebugPane"[\s\S]*?<\/div>\s*<div class="container">/, '<div class="container">');
      html = html.replace('</body>', FIX + '\n</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      document.body.innerHTML='<div class="status">Laden mislukt. Vernieuw de pagina.</div>';
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Trainer AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .app-card { background: #2c3e50; padding: 30px; border-radius: 20px; max-width: 600px; margin: 40px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; margin-bottom: 10px; }
        input { width: 80%; padding: 15px; border-radius: 10px; border: none; margin: 20px 0; font-size: 16px; }
        button { background-color: #2ecc71; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #27ae60; transform: scale(1.05); }
        #coach-antwoord { margin-top: 30px; background: #ecf0f1; color: #2c3e50; padding: 20px; border-radius: 15px; text-align: left; display: none; line-height: 1.6; }
        .label { font-size: 0.9em; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🎾 Pickleball Trainer AI</h1>
        <p class="label">Voer in wat je wilt trainen (bijv. dinken, smash, voetenwerk)</p>
        
        <input type="text" id="coach-vraag" placeholder="Wat gaan we vandaag oefenen?">
        <br>
        <button onclick="vraagCoach()">Vraag Training Advies</button>

        <div id="coach-antwoord"></div>
    </div>

    <script>
        function vraagCoach() {
            const input = document.getElementById('coach-vraag').value.toLowerCase();
            const output = document.getElementById('coach-antwoord');
            output.style.display = "block";
            
            let advies = "";

            if (input.includes("dink") || input.includes("keuken")) {
                advies = "<strong>🔥 Focus: Dinking Mastery</strong><br>1. Houd je knieën laag en je gewicht voorop.<br>2. Gebruik je schouder, niet je pols.<br>3. Oefening: Sla 20 dinks recht en 20 dinks cross-court zonder fouten.";
            } else if (input.includes("smash") || input.includes("hard")) {
                advies = "<strong>🔥 Focus: De Power Smash</strong><br>1. Maak een korte achterzwaai (niet te groot!).<br>2. Richt op de voeten van je tegenstander.<br>3. Oefening: Laat een partner een hoge bal aangeven en focus op de plaatsing in plaats van alleen kracht.";
            } else if (input.includes("voeten") || input.includes("bewegen")) {
                advies = "<strong>🔥 Focus: Voetenwerk & Balans</strong><br>1. Gebruik kleine 'split-steps' voordat de tegenstander slaat.<br>2. Blijf op de bal van je voeten staan.<br>3. Oefening: Doe de 'schaduw-dink' waarbij je zijwaarts beweegt langs de non-volley zone.";
            } else if (input.includes("opslag") || input.includes("serve")) {
                advies = "<strong>🔥 Focus: Diepe Opslag</strong><br>1. Mik op de achterste 1 meter van het vak.<br>2. Houd je zwaai vloeiend onderhands.<br>3. Oefening: Probeer 10 keer achter elkaar de bal diep in de hoek te serveren.";
            } else {
                advies = "<strong>Coach Tip:</strong> Voor '" + input + "' is de basis altijd: oog op de bal en een stabiele houding. Wil je specifieke boormaterialen voor dit onderdeel? Vraag naar dinken, smashen of voetenwerk!";
            }

            output.innerHTML = advies;
        }
    </script>
</body>
</html>

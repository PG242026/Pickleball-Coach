<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach herstellen</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#1f5f3b;color:white;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}main{max-width:560px}h1{font-size:30px;margin:0 0 12px}p{font-size:18px;line-height:1.5}.status{background:white;color:#1f5f3b;border-radius:14px;padding:14px 16px;margin-top:18px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Pickleball Coach wordt hersteld</h1>
<p>De oude browser-cache wordt verwijderd. Daarna opent de app automatisch opnieuw.</p>
<div id="status" class="status">Bezig...</div>
</main>
<script>
(function(){
  const status=document.getElementById('status');
  let doorgaan=false;
  function openApp(){
    if(doorgaan)return;
    doorgaan=true;
    status.textContent='Klaar. App opnieuw openen...';
    location.replace('/?v=herstel-v46');
  }
  setTimeout(openApp,7000);
  (async function(){
    try{
      status.textContent='Oude app-versie verwijderen...';
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
      status.textContent='Nieuwe app-versie laden...';
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.register('/service-worker.js?v=force-v46',{scope:'/'});
        if(reg.installing || reg.waiting){
          await new Promise(resolve=>setTimeout(resolve,2500));
        }
      }
      openApp();
    }catch(e){
      openApp();
    }
  })();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <style>

        h1 {

            margin-bottom: 15px;

        select, input {

            border-radius: 30px;

            background: #333;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-coach {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;

            font-weight: bold;

        .trainer-blok {

        .niveau-label {

            margin-bottom: 10px;

        .btn-youtube {

            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;

            text-align: center;
            margin-top: 15px;

        }

        .video-wrapper {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #555;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: auto;
            display: none;
        }

        #placeholder-text {
            color: #777;
            font-size: 14px;
            padding: 20px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn-cam-toggle {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-rec {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .btn-stop {
            background: #f1c40f;
            color: black;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        #recording-status {
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="app-card">
        <h1>Pickleball Coach Online</h1>

        <select id="niveau-filter" onchange="vulOefeningen()">
            <option value="Alles">Alle niveaus</option>
            <option value="Beginner">Beginner</option>
            <option value="Gemiddeld">Gemiddeld</option>
            <option value="Gevorderd">Gevorderd</option>

            <option value="">Kies eerst een oefening</option>
        </select>

        <button class="btn-coach" onclick="vraagCoach()">Advies & Lesplan</button>

        <div id="coach-antwoord"></div>
    </div>

    <div class="app-card">
        <h1>Video Analyse Tool</h1>

        <div id="recording-status">🔴 OPNAME LOOPT...</div>

        <div class="video-wrapper">
            <div id="placeholder-text">Camera staat uit</div>
            <video id="preview" autoplay playsinline muted></video>
            <video id="recorded-video" controls></video>
        </div>

        <div class="controls">
            <button id="camToggleBtn" class="btn-cam-toggle" onclick="toggleCamera()">📷 Camera Activeren</button>
            <button id="startBtn" class="btn-rec" onclick="startRecording()">🔴 Start Opname</button>
            <button id="stopBtn" class="btn-stop" onclick="stopRecording()">⏹ Stop & Analyseer</button>
        </div>
    </div>

    { naam: "Dink forehand", uitleg: "Zachte forehand dink aan het net.", techniek: "Touch, paddlepositie en controle.", doel: "Rustige rally opbouwen.", fysiek: "Stabiliteit en coördinatie.", niveau: "Beginner", categorie: "Dink" },

    { naam: "Forehand drive", uitleg: "Forehand grondslag oefenen.", techniek: "Goede voorbereiding en doorzwaai.", doel: "Initiatief nemen.", fysiek: "Voetenwerk.", niveau: "Beginner", categorie: "Drive" },
    { naam: "Gripdruk uitleg", uitleg: "Leren hoe hard je de paddle vasthoudt.", techniek: "Ontspannen grip.", doel: "Meer balgevoel.", fysiek: "Controle.", niveau: "Beginner", categorie: "Techniek" },
    { naam: "Serve consistentie", uitleg: "Betrouwbare service oefenen.", techniek: "Herhaalbare servicebeweging.", doel: "Rally goed starten.", fysiek: "Stabiliteit.", niveau: "Beginner", categorie: "Serve" },
    { naam: "Shadow footwork", uitleg: "Voetenwerk zonder bal.", techniek: "Patronen herhalen.", doel: "Positiespel automatiseren.", fysiek: "Uithouding.", niveau: "Beginner", categorie: "Voetenwerk" },
    { naam: "Split step timing", uitleg: "Op het juiste moment klaarstaan.", techniek: "Kleine sprong voor reactie.", doel: "Sneller starten naar de bal.", fysiek: "Explosiviteit.", niveau: "Beginner", categorie: "Voetenwerk" },
    { naam: "Sweet Spot", uitleg: "De bal goed in het midden van de paddle raken.", techniek: "Rustig mikken en goed kijken.", doel: "Meer controle en plaatsing.", fysiek: "Training.", niveau: "Beginner", categorie: "Techniek" },
    { naam: "Volley forehand", uitleg: "Forehand volley aan het net.", techniek: "Snelle paddlepositie.", doel: "Netdominantie opbouwen.", fysiek: "Reactiesnelheid.", niveau: "Beginner", categorie: "Volley" },
    { naam: "Volley backhand", uitleg: "Backhand volley slaan.", techniek: "Timing en stabiliteit.", doel: "Middengebied controleren.", fysiek: "Reactie.", niveau: "Beginner", categorie: "Volley" },
    { naam: "Volley block", uitleg: "Harde bal blokkeren.", techniek: "Compacte beweging.", doel: "Power-hitters vertragen.", fysiek: "Reactie.", niveau: "Beginner", categorie: "Volley" },

    { naam: "Backhand drive", uitleg: "Krachtige backhand met eventueel slice.", techniek: "Backhand power.", doel: "Diepe drukballen slaan.", fysiek: "Kracht en balans.", niveau: "Gemiddeld", categorie: "Drive" },
    { naam: "Cross spelen", uitleg: "Cross-court spelen.", techniek: "Bal plaatsen.", doel: "Return moeilijker maken.", fysiek: "Controle.", niveau: "Gemiddeld", categorie: "Plaatsing" },
    { naam: "Cross-court return", uitleg: "Return schuin over de baan.", techniek: "Balplacement.", doel: "Voordeel maximaliseren.", fysiek: "Uithouding.", niveau: "Gemiddeld", categorie: "Return" },
    { naam: "Dink & Netspel", uitleg: "Dinkcontrole verbeteren.", techniek: "Zachte touch aan het net.", doel: "Rust bewaren aan het net.", fysiek: "Balans op één been.", niveau: "Gemiddeld", categorie: "Dink" },
    { naam: "Dink cross-court", uitleg: "Cross-court dink spelen.", techniek: "Precisie en spincontrole.", doel: "Tegenstander uit positie dwingen.", fysiek: "Voetenwerk.", niveau: "Gemiddeld", categorie: "Dink" },
    { naam: "Dink–dink–attack", uitleg: "Twee rustige dinks gevolgd door aanval.", techniek: "Variatie in tempo.", doel: "Aanvalskansen creëren.", fysiek: "Snelheid.", niveau: "Gemiddeld", categorie: "Aanval" },
    { naam: "Door het midden spelen", uitleg: "Bal tussen twee spelers plaatsen.", techniek: "Gerichte balplaatsing.", doel: "Twijfel veroorzaken.", fysiek: "Kijken naar positie tegenstander.", niveau: "Gemiddeld", categorie: "Tactiek" },
    { naam: "Hard Hitters verslaan", uitleg: "Harde ballen controleren.", techniek: "Pareren en vertragen.", doel: "Tegenstander uit ritme halen.", fysiek: "Coördinatie.", niveau: "Gemiddeld", categorie: "Verdediging" },

    { naam: "Poaching oefenen", uitleg: "Aan het net een bal overnemen.", techniek: "Eerst bewegen, dan slaan.", doel: "Zwakke volley afstraffen.", fysiek: "Wendbaarheid.", niveau: "Gemiddeld", categorie: "Dubbelspel" },
    { naam: "Serve power", uitleg: "Krachtige service slaan.", techniek: "Diepe krachtige slag.", doel: "Druk zetten op returner.", fysiek: "Core en schouder.", niveau: "Gemiddeld", categorie: "Serve" },
    { naam: "Third shot", uitleg: "Derde bal na service oefenen.", techniek: "Drop of drive kiezen.", doel: "Rally goed opbouwen.", fysiek: "Korte sprintjes.", niveau: "Gemiddeld", categorie: "Third shot" },

    { naam: "Verdedigen van de harde bal", uitleg: "Harde bal controleren.", techniek: "Kort en laag terugspelen.", doel: "Bal vertragen.", fysiek: "Controle.", niveau: "Gemiddeld", categorie: "Verdediging" },
    { naam: "Wall (Muur) strategie", uitleg: "Samen sterk verdedigen.", techniek: "Ondoordringbare verdediging.", doel: "Als team bewegen.", fysiek: "Samenwerking.", niveau: "Gemiddeld", categorie: "Strategie" },

    { naam: "Bevels Toepassen", uitleg: "Bevels en commando’s toepassen.", techniek: "Juiste paddle stand.", doel: "Effectiever spelen.", fysiek: "Controle.", niveau: "Gevorderd", categorie: "Tactiek" },

    { naam: "Stacking service", uitleg: "Positiespel bij stacking.", techniek: "Snel naar eigen plek lopen.", doel: "Beste verdeling op de baan.", fysiek: "Snelheid.", niveau: "Gevorderd", categorie: "Strategie" },
    { naam: "Stacking drills", uitleg: "Stacking oefenen in dubbelspel.", techniek: "Footwork en rotatie.", doel: "Sterktes maximaliseren.", fysiek: "Conditie.", niveau: "Gevorderd", categorie: "Strategie" },
    { naam: "Third shot Drop (Drip)", uitleg: "Topspin in de derde bal drop.", techniek: "Effect in drop.", doel: "Gecontroleerd druk zetten.", fysiek: "Minder polsbeweging.", niveau: "Gevorderd", categorie: "Third shot" },
    { naam: "Topspins slaan", uitleg: "Topspin gebruiken bij aanvallende slagen.", techniek: "Van laag naar hoog door de bal.", doel: "Bal met druk en marge spelen.", fysiek: "Timing en controle.", niveau: "Gevorderd", categorie: "Spin" },
    { naam: "Volley Punch-volley", uitleg: "Korte krachtige volley.", techniek: "Compacte punchbeweging.", doel: "Hoge ballen afstraffen.", fysiek: "Explosiviteit.", niveau: "Gevorderd", categorie: "Volley" }
];

function vulOefeningen() {
    const niveau = document.getElementById("niveau-filter").value;
    const select = document.getElementById("coach-vraag");

    select.innerHTML = '<option value="">Kies eerst een oefening</option>';

    oefeningen.forEach((oefening, index) => {
        if (niveau === "Alles" || oefening.niveau === niveau) {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = oefening.naam + " - " + oefening.niveau;
            select.appendChild(option);
        }
    });
}

function vraagCoach() {
    const gekozenIndex = document.getElementById("coach-vraag").value;
    const output = document.getElementById("coach-antwoord");

    if (gekozenIndex === "") {
        return alert("Kies eerst een oefening");
    }

    const oefening = oefeningen[gekozenIndex];

    const ytLink = "https://www.youtube.com/results?search_query=pickleball+" 
        + encodeURIComponent(oefening.naam) 
        + "+tutorial";

    output.style.display = "block";

    output.innerHTML = `
        <span class="niveau-label">${oefening.niveau}</span>
        <h2>${oefening.naam}</h2>

        <p><strong>Categorie:</strong> ${oefening.categorie}</p>
        <p><strong>Uitleg:</strong> ${oefening.uitleg}</p>
        <p><strong>Techniek:</strong> ${oefening.techniek}</p>
        <p><strong>Doel:</strong> ${oefening.doel}</p>
        <p><strong>Fysieke focus:</strong> ${oefening.fysiek}</p>

        <div class="trainer-blok">
            <strong>Trainerstip:</strong><br>
            Begin rustig. Let op houding, balans, voetenwerk en paddlepositie.
            Film de speler daarna met de video-analyse en bespreek samen wat beter kan.
        </div>

        <div class="trainer-blok">
            <strong>Lesopbouw:</strong><br>
            1. 5 minuten uitleg<br>
            2. 10 minuten rustig oefenen<br>
            3. 10 minuten met rally of wedstrijdvorm<br>
            4. 5 minuten video terugkijken
        </div>

        <a href="${ytLink}" target="_blank" class="btn-youtube">
            ▶ Video voorbeelden bekijken
        </a>
    `;
}

vulOefeningen();

let stream = null;
let recorder;
let chunks = [];

const preview = document.getElementById("preview");
const recordedVideo = document.getElementById("recorded-video");
const camBtn = document.getElementById("camToggleBtn");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const placeholder = document.getElementById("placeholder-text");

async function toggleCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;

        preview.style.display = "none";
        recordedVideo.style.display = "none";
        placeholder.style.display = "block";

        camBtn.innerText = "📷 Camera Activeren";
        camBtn.style.background = "#3498db";
        startBtn.style.display = "none";
        stopBtn.style.display = "none";
    } else {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });

            preview.srcObject = stream;
            preview.style.display = "block";
            recordedVideo.style.display = "none";
            placeholder.style.display = "none";

            camBtn.innerText = "🔌 Camera Deactiveren";
            camBtn.style.background = "#555";
            startBtn.style.display = "block";
        } catch (err) {
            alert("Geen toegang tot camera. Controleer je browserrechten.");
        }
    }
}

function startRecording() {
    if (!stream) {
        return alert("Zet eerst de camera aan.");
    }

    chunks = [];
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = e => {
        if (e.data.size > 0) {
            chunks.push(e.data);
        }
    };

    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        recordedVideo.src = URL.createObjectURL(blob);

        preview.style.display = "none";
        recordedVideo.style.display = "block";
    };

    recorder.start();

    startBtn.style.display = "none";
    stopBtn.style.display = "block";
    document.getElementById("recording-status").style.display = "block";
}

function stopRecording() {
    if (recorder && recorder.state !== "inactive") {
        recorder.stop();
    }

    startBtn.style.display = "block";
    stopBtn.style.display = "none";
    document.getElementById("recording-status").style.display = "none";
}
</script>

</html>

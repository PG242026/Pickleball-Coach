  function injectStyle(doc){if(doc.getElementById('coach-youtube-compare-fix'))return;const style=doc.createElement('style');style.id='coach-youtube-compare-fix';style.textContent='.pwa-debug{display:none!important}.youtube-panel-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0}.youtube-panel-actions button{margin:0;min-height:46px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center}.youtube-compare-panel{display:block!important;width:100%;box-sizing:border-box;clear:both;margin-top:10px;background:#eef7f1;padding:14px;border-radius:15px;border:1px solid #d2e7db}.coach-paid-divider{border-top:1px solid #b9d2c3!important;padding-top:14px!important;margin-top:14px!important}.youtube-compare-panel .sync-accordion{background:#f7fcf9}.youtube-compare-panel details{display:block!important}.youtube-compare-panel details>.sync-paneel{display:block!important;max-height:none!important;overflow:visible!important;padding:4px 14px 14px!important}.youtube-compare-panel .sync-groep{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin-top:10px!important}.youtube-compare-panel .sync-groep button{display:flex!important;width:100%!important;margin:0!important;justify-content:flex-start!important;text-align:left!important}.video-analyse-sectie{width:100%;box-sizing:border-box;margin-top:14px}.player-analysis-outside{margin-top:14px!important}.video-analyse-sectie .video-analysis-paneel{display:block!important}.video-analyse-sectie .analyse-controls,.video-analyse-sectie .sessie-sectie{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:10px!important}.video-analyse-sectie .help-pair{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;margin:0!important;width:auto!important;max-width:100%!important}.video-analyse-sectie .help-pair>button:not(.help-icon){margin:   function closePopups(doc){doc.querySelectorAll('.popup').forEach(p=>p.style.display='none');const bg=doc.getElementById('popupAchtergrond');if(bg)bg.style.display='none'} function openPopup(doc,id){closePopups(doc);const bg=doc.getElementById('popupAchtergrond'),p=doc.getElementById(id);if(bg)bg.style.display='block';if(p)p.style.display='block'} function showMessage(text){try{frame.contentWindow.toonMelding(text);return}catch(e){}status.textContent=text;status.style.display='block';setTimeout(()=>status.style.display='none',3500)}

  function pairHelpButtons(doc){doc.querySelectorAll('.video-analyse-sectie .help-icon').forEach(help=>{if(help.parentElement&&help.parentElement.classList.contains('help-pair'))return;const prev=help.previousElementSibling;if(!prev||prev.classList.contains('help-icon'))return;const pair=doc.createElement('span');pair.className='help-pair';prev.parentNode.insertBefore(pair,prev);pair.appendChild(prev);pair.appendChild(help)})} function showPendingFeedbackThanks(){if(sessionStorage.getItem('pickleballFeedbackBedankt')!=='1')return;sessionStorage.removeItem('pickleballFeedbackBedankt');showMessage(tr().feedbackSent)} window.addEventListener('focus',()=>setTimeout(showPendingFeedbackThanks,250));window.addEventListener('pageshow',()=>setTimeout(showPendingFeedbackThanks,250));document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(showPendingFeedbackThanks,250)});
  function sendFeedback(doc){const naamEl=doc.getElementById('feedbackNaam'),soortEl=doc.getElementById('feedbackSoort'),berichtEl=doc.getElementById('feedbackBericht');const naam=(naamEl&&naamEl.value)||'Onbekend',soort=(soortEl&&soortEl.value)||'Feedback',bericht=(berichtEl&&berichtEl.value)||'';if(!bericht.trim()){showMessage('⚠️ Typ eerst je feedback');return}const subject=encodeURIComponent('Feedback Pickleball Coach AI - '+soort),body=encodeURIComponent('Naam: '+naam+'\nSoort: '+soort+'\nDatum: '+new Date().toLocaleString('nl-NL')+'\n\nFeedback:\n'+bericht);if(naamEl)naamEl.value='';if(berichtEl)berichtEl.value='';if(soortEl)soortEl.selectedIndex=0;closePopups(doc);sessionStorage.setItem('pickleballFeedbackBedankt','1');window.location.href='mailto:hcvsabben@gmail.com?subject='+subject+'&body='+body}
  function installClicks(doc){if(doc.defaultView.__coachClicksInstalled)return;doc.defaultView.__coachClicksInstalled=true;doc.addEventListener('click',event=>{const old=doc.getElementById('coachHelpTip');if(old)old.remove();const help=event.target.closest&&event.target.closest('.help-icon');if(help){event.preventDefault();event.stopPropagation();const tip=doc.createElement('div');tip.id='coachHelpTip';tip.className='coach-help-tip';tip.textContent=help.getAttribute('data-help')||help.getAttribute('aria-label')||'Uitleg volgt later.';doc.body.appendChild(tip);const r=help.getBoundingClientRect();tip.style.left=Math.max(8,r.left+doc.defaultView.scrollX)+'px';tip.style.top=(r.bottom+8+doc.defaultView.scrollY)+'px';return}const b=event.target.closest&&event.target.closest('button');if(!b)return;const action=b.getAttribute('onclick')||'',l=languageFromButton(b,action);if(l){event.preventDefault();event.stopPropagation();setLanguage(doc,l);return}if(action.includes('openHandleiding')){event.preventDefault();event.stopPropagation();try{frame.contentWindow.renderHandleiding()}catch(e){};openPopup(doc,'handleidingPopup');return}if(action.includes('openTaal')){event.preventDefault();event.stopPropagation();openPopup(doc,'taalPopup');return}if(action.includes('openFeedback')){event.preventDefault();event.stopPropagation();openPopup(doc,'feedbackPopup');return}if(action.includes('verstuurFeedback')){event.preventDefault();event.stopPropagation();sendFeedback(doc);return}if(action.includes('sluitAllePopups')){event.preventDefault();event.stopPropagation();closePopups(doc)}},true)}
  function fixInFrame(){const doc=frame.contentDocument;if(!doc)return false;injectStyle(doc);installClicks(doc);const debug=doc.getElementById('pwaDebugPane');if(debug)debug.style.display='none';const title=doc.getElementById('youtubeVideoTitle'),youtubeBox=title&&title.closest('.video-box');if(!youtubeBox)return false;const actionRow=youtubeBox.querySelector('.knopgroep,.youtube-panel-actions');if(!actionRow)return false;actionRow.classList.add('youtube-panel-actions');const compare=doc.querySelector('.in-youtube-panel')||doc.querySelector('.in-manage-videos')||doc.querySelector('.sync-box');if(compare){compare.classList.add('youtube-compare-panel','in-youtube-panel','coach-paid-divider');compare.classList.remove('in-manage-videos','sync-box');actionRow.insertAdjacentElement('afterend',compare);const details=compare.querySelector('details');if(details){details.open=true;details.setAttribute('open','open')}const paneel=compare.querySelector('.sync-paneel');if(paneel){paneel.style.maxHeight='none';paneel.style.overflow='visible';paneel.style.padding='4px 14px 14px'}}const analysis=doc.querySelector('.video-analyse-sectie'),manage=doc.getElementById('manageVideosAccordion');if(analysis&&manage){analysis.classList.add('player-analysis-outside');manage.insertAdjacentElement('afterend',analysis);pairHelpButtons(doc)}applyCoachLanguage(doc);showPendingFeedbackThanks();status.style.display='none';return !!compare}

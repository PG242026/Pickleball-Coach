<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#1f5f3b;font-family:Arial,Helvetica,sans-serif}#status{position:fixed;left:16px;right:16px;bottom:16px;z-index:2;background:white;color:#1f5f3b;border-radius:12px;padding:12px 14px;text-align:center;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.18)}#outerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#1f5f3b}
</style>
</head>
<body>
<div id="status">Pickleball Coach laden...</div>
<iframe id="outerFrame" src="/coach.html?v=16"></iframe>
<script>
(function(){
  const outer=document.getElementById('outerFrame');
  const status=document.getElementById('status');

  function getAppDocument(){
    try{
      const outerDoc=outer.contentDocument;
      if(!outerDoc)return null;
      const appFrame=outerDoc.getElementById('appFrame');
      if(!appFrame)return null;
      return appFrame.contentDocument;
    }catch(e){return null;}
  }

  function applyCleanPaywallLayout(){
    const doc=getAppDocument();
    if(!doc)return false;
    if(!doc.getElementById('coach-clean-paywall-style')){
      const style=doc.createElement('style');
      style.id='coach-clean-paywall-style';
      style.textContent=[
        '.player-video-separator{border:0!important;border-top:1px solid #b9d2c3!important;margin:28px 0 14px!important;height:0!important;background:transparent!important}',
        '.player-box .hidden-during-recording .player-video-separator{margin:28px 0 14px!important}',
        '.youtube-compare-panel{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;margin-top:18px!important}',
        '.youtube-compare-panel.coach-paid-divider{border-top:1px solid #b9d2c3!important;padding-top:14px!important}',
        '.youtube-compare-panel .sync-accordion{background:#f7fcf9!important;border:1px solid #d2e7db!important;border-radius:12px!important;overflow:hidden!important}',
        '.youtube-compare-panel .sync-accordion>summary{background:#f7fcf9!important}',
        '.youtube-compare-panel .sync-paneel{background:#f7fcf9!important}',
        '.video-analyse-sectie.player-analysis-outside{border-top:1px solid #b9d2c3!important;padding-top:14px!important;margin-top:18px!important}',
        '.video-analyse-sectie.player-analysis-outside>.sync-accordion{background:#f7fcf9!important}'
      ].join('\n');
      doc.head.appendChild(style);
    }
    const compare=doc.querySelector('.youtube-compare-panel');
    if(compare)compare.classList.add('coach-paid-divider');
    const analysis=doc.querySelector('.video-analyse-sectie.player-analysis-outside');
    if(analysis)analysis.classList.add('coach-paid-divider-left');
    status.style.display='none';
    return !!compare;
  }

  outer.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      tries++;
      const ok=applyCleanPaywallLayout();
      if(ok||tries>60)clearInterval(timer);
      if(tries>60)status.textContent='App geladen. Vernieuw als de lijn niet zichtbaar is.';
    },250);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach Analyse</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    color:#333;
    margin:0;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

h1{
    text-align:center;
    color:#0b7a3b;
}

h2{
    color:#0b7a3b;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin:8px 0 15px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    background:#0b7a3b;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin:5px 5px 5px 0;
}

button:hover{
    background:#095f2f;
}

.video-row{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.video-box{
    flex:1;
    min-width:300px;
}

video, iframe{
    width:100%;
    height:360px;
    background:black;
    border-radius:12px;
}

.pinpoint{
    background:#eef8f1;
    border-left:5px solid #0b7a3b;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
}

.small{
    font-size:14px;
    color:#666;
}
</style>
</head>

<body>

<h1>🏓 Pickleball Coach Analyse</h1>

<div class="card">
    <h2>Pickleball Pro Coach</h2>

    <label>Naam speler</label>
    <input type="text" id="spelerNaam" placeholder="Bijvoorbeeld Testkees">

    <label>Niveau</label>
    <select id="niveau">
        <option>Beginner</option>
        <option>Gemiddeld</option>
        <option>Gevorderd</option>
    </select>

    <label>Techniek</label>
    <select id="techniek">
        <option>Footwork</option>
        <option>Serve</option>
        <option>Forehand</option>
        <option>Backhand</option>
        <option>Volley</option>
        <option>Dink</option>
        <option>Return</option>
    </select>
</div>

<div class="card">
    <h2>🎥 Upload leerling video</h2>

    <input type="file" id="videoUpload" accept="video/*">

    <button onclick="zoekYoutubeVoorbeeld()">🔍 Zoek YouTube voorbeeldvideo</button>

    <p class="small">
        De zoekterm wordt automatisch gemaakt van niveau + techniek.
    </p>
</div>

<div class="card">
    <h2>📺 Side-by-side Analyse</h2>

    <div class="video-row">
        <div class="video-box">
            <h3>Leerling Video</h3>
            <video id="leerlingVideo" controls></video>
        </div>

        <div class="video-box">
            <h3>YouTube Voorbeeld</h3>
            <iframe id="youtubeFrame" src="" allowfullscreen></iframe>
        </div>
    </div>
</div>

<div class="card">
    <h2>📌 Pinpoint Analyse</h2>

    <label>Tijdstip video</label>
    <input type="text" id="tijdstip" placeholder="Bijvoorbeeld 00:12">

    <label>Analyse of verbeterpunt</label>
    <textarea id="analyseTekst" rows="5" placeholder="Schrijf hier je analyse of verbeterpunt"></textarea>

    <button onclick="voegPinpointToe()">📌 Pinpoint Toevoegen</button>
    <button onclick="downloadAnalyse()">⬇ Download Analyse</button>

    <div id="pinpoints"></div>
</div>

<script>
let pinpoints = [];

document.getElementById("videoUpload").addEventListener("change", function(){
    const file = this.files[0];

    if(file){
        const videoURL = URL.createObjectURL(file);
        document.getElementById("leerlingVideo").src = videoURL;
    }
});

function zoekYoutubeVoorbeeld(){
    const niveau = document.getElementById("niveau").value;
    const techniek = document.getElementById("techniek").value;

    const zoekterm = `pickleball ${techniek} ${niveau} drill`;

    const youtubeZoekUrl =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(zoekterm);

    window.open(youtubeZoekUrl, "_blank");

    alert("Kies op YouTube een voorbeeldvideo. Kopieer daarna de YouTube-link en plak die in de volgende stap.");
    
    const link = prompt("Plak hier de YouTube-link van de voorbeeldvideo:");

    if(link){
        laadYoutubeVideo(link);
    }
}

function laadYoutubeVideo(link){
    let videoId = "";

    if(link.includes("watch?v=")){
        videoId = link.split("watch?v=")[1].split("&")[0];
    } else if(link.includes("youtu.be/")){
        videoId = link.split("youtu.be/")[1].split("?")[0];
    }

    if(videoId){
        document.getElementById("youtubeFrame").src =
            "https://www.youtube.com/embed/" + videoId;
    } else {
        alert("Deze YouTube-link wordt niet herkend.");
    }
}

function voegPinpointToe(){
    const speler = document.getElementById("spelerNaam").value || "Onbekende speler";
    const niveau = document.getElementById("niveau").value;
    const techniek = document.getElementById("techniek").value;
    const tijdstip = document.getElementById("tijdstip").value;
    const analyse = document.getElementById("analyseTekst").value;

    const datum = new Date().toLocaleString("nl-NL", {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });

    const pinpoint = {
        speler,
        niveau,
        techniek,
        datum,
        tijdstip,
        analyse
    };

    pinpoints.push(pinpoint);

    const div = document.createElement("div");
    div.className = "pinpoint";
    div.innerHTML = `
        <strong>Speler:</strong> ${speler}<br>
        <strong>Niveau:</strong> ${niveau}<br>
        <strong>Techniek:</strong> ${techniek}<br>
        <strong>Datum:</strong> ${datum}<br>
        <strong>Tijdstip video:</strong> ${tijdstip}<br>
        <strong>Analyse:</strong> ${analyse}
    `;

    document.getElementById("pinpoints").appendChild(div);

    document.getElementById("tijdstip").value = "";
    document.getElementById("analyseTekst").value = "";
}

function downloadAnalyse(){
    const speler = document.getElementById("spelerNaam").value || "Onbekende speler";
    const techniek = document.getElementById("techniek").value;

    let tekst = "PICKLEBALL COACH ANALYSE\n";
    tekst += "========================\n\n";

    pinpoints.forEach((p, index) => {
        tekst += `Pinpoint ${index + 1}\n`;
        tekst += `Speler: ${p.speler}\n`;
        tekst += `Niveau: ${p.niveau}\n`;
        tekst += `Techniek: ${p.techniek}\n`;
        tekst += `Datum: ${p.datum}\n`;
        tekst += `Tijdstip video: ${p.tijdstip}\n`;
        tekst += `Analyse: ${p.analyse}\n`;
        tekst += "------------------------\n\n";
    });

    const datum = new Date();
    const bestandsDatum =
        datum.getDate() + "-" +
        (datum.getMonth() + 1) + "-" +
        datum.getFullYear();

    const bestandsNaam =
        `${speler}_${techniek}_${bestandsDatum}.txt`;

    const blob = new Blob([tekst], {type:"text/plain"});
    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = bestandsNaam;
    link.click();
}
</script>

</body>
</html>

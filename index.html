<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Coach Online</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-attachment: fixed; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.95); padding: 30px; border-radius: 25px; max-width: 600px; margin: 20px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
        .subtitle { color: #bdc3c7; margin-bottom: 25px; font-size: 14px; }
        input { width: 90%; padding: 15px; border-radius: 30px; border: 2px solid #2ecc71; background: #333; color: white; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; box-sizing: border-box; }
        .btn-coach { background: #2ecc71; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; width: 100%; margin-bottom: 10px; text-transform: uppercase; }
        .btn-reset { background: #555; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; margin-top: 15px; transition: 0.3s; }
        .btn-youtube { background: #ff0000; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; width: 100%; text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center; }
        .btn-coach:hover, .btn-youtube:hover { opacity: 0.8; transform: scale(1.02); }
        #coach-antwoord { margin-top: 30px; background: white; color: #333; padding: 25px; border-radius: 20px; text-align: left; display: none; border-bottom: 5px solid #2ecc71; }
        .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .tip-box { background: #f0f7f0; border-left: 4px solid #2ecc71; padding: 10px; margin-top: 15px; font-size: 13px; color: #555; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>Pickleball Coach Online</h1>
        <p class="subtitle">Verbeter je paddle skills en tactiek</p>
        
        <input type="text" id="coach-vraag" placeholder="Welke slag wil je trainen?" onkeypress="checkEnter(event)">
        <br>
        <button class="btn-coach" onclick="vraagCoach()">Vraag Advies</button>

        <div id="coach-antwoord"></div>
        <button id="reset-button" class="btn-reset" style="display:none;" onclick="resetApp()">Wissen</button>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === "Enter") {
                vraagCoach();
            }
        }

        function vraagCoach() {
            const inputField = document.getElementById('coach-vraag');
            const input = inputField.value;
            const output = document.getElementById('coach-antwoord');
            const resetBtn = document.getElementById('reset-button');
            
            if(!input) return alert("Typ eerst even welke paddle slag je wilt leren!");

            output.style.display = "block";
            resetBtn.style.display = "inline-block";
            
            // We voegen 'nederlands ondertiteld' toe aan de zoekopdracht
            const zoekTerm = "pickleball " + input + " tutorial dutch subtitles";
            const ytLink = "https://www.youtube.com/results?search_query=" + encodeURIComponent(zoekTerm);

            let advies = "";
            let laagInput = input.toLowerCase();
            
            if (laagInput.includes("dink")) {
                advies = "Houd je paddle stabiel en maak een korte opwaartse beweging vanuit je schouder.";
            } else if (laagInput.includes("opslag") || laagInput.includes("serve")) {
                advies = "Sla de bal onderhands en mik diep in het vak.";
            } else {
                advies = "Focus voor " + input + " op je balans en houd je paddle altijd klaar voor je lichaam.";
            }

            output.innerHTML = `
                <span class="tag">PADDLE TRAINING</span>
                <h3>Advies voor: ${input}</h3>
                <p>${advies}</p>
                <hr>
                <a href="${ytLink}" target="_blank" class="btn-youtube">▶ Bekijk Video's (NL Ondertiteld)</a>
                <div class="tip-box">
                    <strong>Tip voor vertaling:</strong><br>
                    Klik in de video op het ⚙️ icoontje -> <em>Ondertiteling</em> -> <em>Automatisch vertalen</em> -> <em>Nederlands</em>.
                </div>
            `;
            
            inputField.value = "";
            inputField.blur();
        }

        function resetApp() {
            document.getElementById('coach-antwoord').style.display = "none";
            document.getElementById('reset-button').style.display = "none";
            document.getElementById('coach-vraag').value = "";
        }
    </script>
</body>
</html>

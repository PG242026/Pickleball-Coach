<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#1f5f3b;font-family:Arial,Helvetica,sans-serif}#status{position:fixed;inset:auto 16px 16px 16px;z-index:2;background:white;color:#1f5f3b;border-radius:12px;padding:12px 14px;text-align:center;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.18)}#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#1f5f3b}
</style>
</head>
<body>
<div id="status">Pickleball Coach laden...</div>
<iframe id="appFrame" src="/index.html?coach=v13"></iframe>
<script>
(function(){
  const frame=document.getElementById('appFrame');
  const status=document.getElementById('status');

  function injectStyle(doc){
    if(doc.getElementById('coach-youtube-compare-fix'))return;
    const style=doc.createElement('style');
    style.id='coach-youtube-compare-fix';
    style.textContent='.pwa-debug{display:none!important}.youtube-panel-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0}.youtube-panel-actions button{margin:0;min-height:46px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center}.youtube-compare-panel{display:block!important;width:100%;box-sizing:border-box;clear:both;margin-top:10px;background:#eef7f1;padding:14px;border-radius:15px;border:1px solid #d2e7db}.youtube-compare-panel .sync-accordion{background:#f7fcf9}.youtube-compare-panel details{display:block!important}.youtube-compare-panel details>.sync-paneel{display:block!important;max-height:none!important;overflow:visible!important;padding:4px 14px 14px!important}.youtube-compare-panel .sync-groep{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin-top:10px!important}.youtube-compare-panel .sync-groep button{display:flex!important;width:100%!important;margin:0!important;justify-content:flex-start!important;text-align:left!important}.video-analyse-sectie{width:100%;box-sizing:border-box;margin-top:14px}.player-analysis-outside{margin-top:14px!important}.video-analyse-sectie .video-analysis-paneel{display:block!important}.video-analyse-sectie .analyse-controls,.video-analyse-sectie .sessie-sectie{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:10px!important}.video-analyse-sectie .help-pair{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;margin:0!important;width:auto!important;max-width:100%!important}.video-analyse-sectie .help-pair>button:not(.help-icon){margin:0!important}.video-analyse-sectie .help-pair>.help-icon{position:static!important;display:inline-flex!important;flex:0 0 28px!important;width:28px!important;height:28px!important;min-height:28px!important;margin:0!important;padding:0!important}.video-analyse-sectie .analyse-controls>button:not(.help-icon),.video-analyse-sectie .sessie-sectie>button:not(.help-icon){display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;text-align:left!important;margin:0!important;width:auto!important;max-width:100%!important}.video-analyse-sectie .analyse-controls>.help-icon,.video-analyse-sectie .sessie-sectie>.help-icon{margin:0!important}.video-analyse-sectie .momenten-sectie{margin-top:14px!important}.video-analyse-sectie .momenten-sectie button{display:inline-flex!important;justify-content:flex-start!important;text-align:left!important;margin-left:0!important}.coach-help-tip{position:absolute!important;background:#133e27!important;color:#fff!important;padding:9px 11px!important;border-radius:8px!important;font-size:14px!important;line-height:1.35!important;max-width:280px!important;z-index:2147483647!important;box-shadow:0 6px 18px rgba(0,0,0,.25)!important;text-align:left!important}';
    doc.head.appendChild(style);
  }

  function pairHelpButtons(doc){
    doc.querySelectorAll('.video-analyse-sectie .help-icon').forEach(function(help){
      if(help.parentElement&&help.parentElement.classList.contains('help-pair'))return;
      const prev=help.previousElementSibling;
      if(!prev||prev.classList.contains('help-icon'))return;
      const pair=doc.createElement('span');
      pair.className='help-pair';
      prev.parentNode.insertBefore(pair,prev);
      pair.appendChild(prev);
      pair.appendChild(help);
    });
  }

  function closePopups(doc){
    doc.querySelectorAll('.popup').forEach(function(popup){popup.style.display='none';});
    const bg=doc.getElementById('popupAchtergrond');
    if(bg)bg.style.display='none';
  }

  function ensureGuide(doc){
    const c=doc.getElementById('handleidingSecties');
    if(!c)return;
    if(c.children.length===0 && typeof frame.contentWindow.renderHandleiding==='function')try{frame.contentWindow.renderHandleiding();}catch(e){}
    if(c.children.length>0)return;
    const items=[['Speler kiezen','Kies of voeg eerst een speler toe.'],['Niveau kiezen','Selecteer het niveau zodat de analyse beter past.'],['Video opnemen of uploaden','Neem een korte clip op of laad een bestaande spelersvideo.'],['YouTube voorbeeldvideo','Zoek of plak een voorbeeldvideo om naast de speler te vergelijken.'],['Vergelijk & Afspelen','Start, pauzeer en zet beide video’s gelijk.'],['Analyse','Gebruik automatische houding-analyse, momenten en download de analyse.']];
    c.innerHTML=items.map(function(item){return '<details><summary class="accordion-header"><span class="accordion-title">'+item[0]+'</span><span class="accordion-chevron" aria-hidden="true">⌄</span></summary><p>'+item[1]+'</p></details>';}).join('');
  }

  function openPopup(doc,id){
    closePopups(doc);
    if(id==='handleidingPopup')ensureGuide(doc);
    const bg=doc.getElementById('popupAchtergrond');
    const popup=doc.getElementById(id);
    if(bg)bg.style.display='block';
    if(popup)popup.style.display='block';
  }

  function setLanguage(doc,lang){
    localStorage.setItem('pickleballTaal',lang);
    try{frame.contentWindow.localStorage.setItem('pickleballTaal',lang);}catch(e){}
    if(typeof frame.contentWindow.pasTaalToe==='function')try{frame.contentWindow.pasTaalToe();}catch(e){}
    if(typeof frame.contentWindow.renderHandleiding==='function')try{frame.contentWindow.renderHandleiding();}catch(e){}
    showMessage('🌍 Taal opgeslagen');
    closePopups(doc);
  }

  function showMessage(text){
    if(typeof frame.contentWindow.toonMelding==='function'){
      try{frame.contentWindow.toonMelding(text);return;}catch(e){}
    }
    status.textContent=text;
    status.style.display='block';
    setTimeout(function(){status.style.display='none';},3500);
  }

  function showPendingFeedbackThanks(){
    if(sessionStorage.getItem('pickleballFeedbackBedankt')!=='1')return;
    sessionStorage.removeItem('pickleballFeedbackBedankt');
    showMessage('Bedankt voor uw feedback.');
  }

  window.addEventListener('focus',function(){setTimeout(showPendingFeedbackThanks,250);});
  window.addEventListener('pageshow',function(){setTimeout(showPendingFeedbackThanks,250);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(showPendingFeedbackThanks,250);});

  function sendFeedback(doc){
    const naamEl=doc.getElementById('feedbackNaam');
    const soortEl=doc.getElementById('feedbackSoort');
    const berichtEl=doc.getElementById('feedbackBericht');
    const naam=(naamEl&&naamEl.value)||'Onbekend';
    const soort=(soortEl&&soortEl.value)||'Feedback';
    const bericht=(berichtEl&&berichtEl.value)||'';
    if(!bericht.trim()){
      showMessage('⚠️ Typ eerst je feedback');
      return;
    }
    const subject=encodeURIComponent('Feedback Pickleball Coach AI - '+soort);
    const body=encodeURIComponent('Naam: '+naam+'\nSoort: '+soort+'\nDatum: '+new Date().toLocaleString('nl-NL')+'\n\nFeedback:\n'+bericht);
    if(naamEl)naamEl.value='';
    if(berichtEl)berichtEl.value='';
    if(soortEl)soortEl.selectedIndex=0;
    closePopups(doc);
    sessionStorage.setItem('pickleballFeedbackBedankt','1');
    window.location.href='mailto:hcvsabben@gmail.com?subject='+subject+'&body='+body;
  }

  function installButtonClick(doc){
    if(doc.defaultView.__coachButtonClickInstalled)return;
    doc.defaultView.__coachButtonClickInstalled=true;
    doc.addEventListener('click',function(event){
      const button=event.target.closest&&event.target.closest('button');
      if(!button)return;
      const action=button.getAttribute('onclick')||'';
      if(action.indexOf('openHandleiding')!==-1){event.preventDefault();event.stopPropagation();openPopup(doc,'handleidingPopup');return;}
      if(action.indexOf('openTaal')!==-1){event.preventDefault();event.stopPropagation();openPopup(doc,'taalPopup');return;}
      if(action.indexOf('openFeedback')!==-1){event.preventDefault();event.stopPropagation();openPopup(doc,'feedbackPopup');return;}
      if(action.indexOf('setTaal')!==-1){event.preventDefault();event.stopPropagation();const m=action.match(/setTaal\('([^']+)'\)/);if(m)setLanguage(doc,m[1]);return;}
      if(action.indexOf('verstuurFeedback')!==-1){event.preventDefault();event.stopPropagation();sendFeedback(doc);return;}
      if(action.indexOf('sluitAllePopups')!==-1){event.preventDefault();event.stopPropagation();closePopups(doc);}
    },true);
  }

  function installHelpClick(doc){
    if(doc.defaultView.__coachHelpClickInstalled)return;
    doc.defaultView.__coachHelpClickInstalled=true;
    doc.addEventListener('click',function(event){
      const help=event.target.closest&&event.target.closest('.help-icon');
      const oldTip=doc.getElementById('coachHelpTip');
      if(oldTip)oldTip.remove();
      if(!help)return;
      event.preventDefault();event.stopPropagation();
      const text=help.getAttribute('data-help')||help.getAttribute('aria-label')||'Uitleg volgt later.';
      const tip=doc.createElement('div');
      tip.id='coachHelpTip';tip.className='coach-help-tip';tip.textContent=text;doc.body.appendChild(tip);
      const rect=help.getBoundingClientRect();
      const left=Math.min(rect.left+doc.defaultView.scrollX,doc.documentElement.clientWidth-300+doc.defaultView.scrollX);
      tip.style.left=Math.max(8,left)+'px';tip.style.top=(rect.bottom+8+doc.defaultView.scrollY)+'px';
    },true);
  }

  function fixInFrame(){
    const doc=frame.contentDocument;
    if(!doc)return false;
    injectStyle(doc);installHelpClick(doc);installButtonClick(doc);
    const debug=doc.getElementById('pwaDebugPane');if(debug)debug.style.display='none';
    const title=doc.getElementById('youtubeVideoTitle');
    const youtubeBox=title&&title.closest('.video-box');
    if(!youtubeBox)return false;
    const actionRow=youtubeBox.querySelector('.knopgroep,.youtube-panel-actions');
    if(!actionRow)return false;
    actionRow.classList.add('youtube-panel-actions');
    const compare=doc.querySelector('.in-youtube-panel')||doc.querySelector('.in-manage-videos')||doc.querySelector('.sync-box');
    if(compare){
      compare.classList.add('youtube-compare-panel','in-youtube-panel');compare.classList.remove('in-manage-videos','sync-box');actionRow.insertAdjacentElement('afterend',compare);
      const details=compare.querySelector('details');if(details){details.open=true;details.setAttribute('open','open');}
      const paneel=compare.querySelector('.sync-paneel');if(paneel){paneel.style.maxHeight='none';paneel.style.overflow='visible';paneel.style.padding='4px 14px 14px';}
    }
    const analysis=doc.querySelector('.video-analyse-sectie');
    const manageAccordion=doc.getElementById('manageVideosAccordion');
    if(analysis&&manageAccordion){analysis.classList.add('player-analysis-outside');manageAccordion.insertAdjacentElement('afterend',analysis);pairHelpButtons(doc);}
    showPendingFeedbackThanks();
    status.style.display='none';
    return !!compare;
  }

  frame.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){tries++;const ok=fixInFrame();if(ok||tries>40)clearInterval(timer);if(tries>40)status.textContent='App geladen. Vernieuw als het blok niet zichtbaar is.';},250);
  });
})();
</script>
</body>
</html>

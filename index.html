<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Video Analyse</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 25px; max-width: 600px; margin: 0 auto; border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; font-size: 20px; margin-bottom: 15px; }
        
        /* Video styling */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 2px solid #555; line-height: 0; position: relative; }
        video { width: 100%; height: auto; }
        
        /* Knoppen */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { padding: 15px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .btn-rec { background: #e74c3c; color: white; }
        .btn-stop { background: #f1c40f; color: black; display: none; }
        .btn-play { background: #2ecc71; color: white; }
        
        .status-dot { height: 10px; width: 10px; background-color: #e74c3c; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

        #recorded-video { display: none; width: 100%; }
        .instruction { font-size: 12px; color: #bdc3c7; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>Pickleball Video Analyse</h1>
        
        <div class="video-wrapper">
            <!-- Live preview -->
            <video id="preview" autoplay playsinline muted></video>
            <!-- De opgenomen video (voor terugspoelen) -->
            <video id="recorded-video" controls></video>
        </div>

        <div id="recording-status" style="display:none; margin-bottom: 10px; color: #e74c3c; font-weight: bold;">
            <span class="status-dot"></span> OPNAME LOOPT...
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-rec" onclick="startRecording()">🔴 Start Opname</button>
            <button id="stopBtn" class="btn-stop" onclick="stopRecording()">⏹ Stop & Bekijk</button>
            <button class="btn-play" onclick="resetCamera()">🔄 Live Camera</button>
        </div>

        <p class="instruction">
            1. Druk op <strong>Start</strong> voor een slag.<br>
            2. Druk op <strong>Stop</strong> om te analyseren.<br>
            3. Gebruik de balk onder de video om <strong>terug te spoelen</strong>.
        </p>
    </div>

    <script>
        let preview = document.getElementById("preview");
        let recordedVideo = document.getElementById("recorded-video");
        let startBtn = document.getElementById("startBtn");
        let stopBtn = document.getElementById("stopBtn");
        let recorder;
        let chunks = [];

        // Camera starten bij openen
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                preview.srcObject = stream;
                window.localStream = stream;
            } catch (err) {
                alert("Camera toegang geweigerd of niet beschikbaar.");
            }
        }

        function startRecording() {
            chunks = [];
            recorder = new MediaRecorder(window.localStream);
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = e => {
                let blob = new Blob(chunks, { type: 'video/mp4' });
                let url = URL.createObjectURL(blob);
                recordedVideo.src = url;
                
                // Switch schermen
                preview.style.display = "none";
                recordedVideo.style.display = "block";
            };

            recorder.start();
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            document.getElementById("recording-status").style.display = "block";
        }

        function stopRecording() {
            recorder.stop();
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            document.getElementById("recording-status").style.display = "none";
        }

        function resetCamera() {
            recordedVideo.pause();
            recordedVideo.style.display = "none";
            preview.style.display = "block";
        }

        // Start direct de camera
        setupCamera();
    </script>
</body>
</html>

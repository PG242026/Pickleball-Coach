<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro Coach v2</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1599586120429-48281b6f0ece?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-attachment: fixed; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.9); padding: 30px; border-radius: 25px; max-width: 800px; margin: 20px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { color: #bdc3c7; margin-bottom: 25px; }
        input { width: 80%; padding: 15px; border-radius: 30px; border: 2px solid #2ecc71; background: #333; color: white; font-size: 18px; outline: none; margin-bottom: 15px; }
        button { background: #2ecc71; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; width: 100%; max-width: 300px; }
        button:hover { background: #27ae60; transform: scale(1.05); }
        #coach-antwoord { margin-top: 30px; background: white; color: #333; padding: 25px; border-radius: 20px; text-align: left; display: none; animation: fadeIn 0.5s; }
        .video-container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🎾 Pickleball Coach Rick</h1>
        <p class="subtitle">Jouw persoonlijke digitale trainer voor de baan</p>
        
        <input type="text" id="coach-vraag" placeholder="Wat wil je verbeteren? (bijv. backhand, drop...)">
        <br>
        <button onclick="vraagCoach()">Vraag de Coach</button>

        <div id="coach-antwoord"></div>
    </div>

    <script>
        function vraagCoach() {
            const input = document.getElementById('coach-vraag').value.toLowerCase();
            const output = document.getElementById('coach-antwoord');
            output.style.display = "block";
            
            let content = "";
            let videoId = "";

            if (input.includes("dink")) {
                content = "<span class='tag'>TECHNIEK</span><h3>Dinking Meesterschap</h3><p>De belangrijkste slag in Pickleball. Houd je beweging kort en compact. Gebruik je benen om de hoogte te bepalen, niet je pols.</p><ul><li>Blijf laag bij de keukenlijn</li><li>Zachte druk naar voren</li></ul>";
                videoId = "8vX_490mH3A";
            } else if (input.includes("drop") || input.includes("third")) {
                content = "<span class='tag'>STRATEGIE</span><h3>De Third Shot Drop</h3><p>Hét hulpmiddel om naar het net te komen. Het doel is niet een punt te scoren, maar de bal veilig in de keuken te leggen.</p><ul><li>Raak de bal voor je lichaam</li><li>Volg de bal naar het net</li></ul>";
                videoId = "unX99u8_V6Q";
            } else if (input.includes("backhand")) {
                content = "<span class='tag'>SLAGEN</span><h3>De Stabiele Backhand</h3><p>Veel spelers vinden dit lastig. Zorg voor een vroege voorbereiding en houd je paddle stabiel bij impact.</p>";
                videoId = "vYp-Xn9ZunM";
            } else if (input.includes("serve") || input.includes("opslag")) {
                content = "<span class='tag'>BASIS</span><h3>Krachtige Diepe Opslag</h3><p>Focus op diepte in plaats van snelheid. Een diepe opslag houdt je tegenstander achterin.</p>";
                videoId = "R7NAnv99U_A";
            } else if (input.includes("volley") || input.includes("net")) {
                content = "<span class='tag'>NETSPEL</span><h3>Snelle Volleys</h3><p>Houd je paddle voor je gezicht ('ready position'). Korte reacties zijn beter dan grote zwaaien.</p>";
                videoId = "oE066_3PCHY";
            } else {
                content = "<span class='tag'>COACH TIP</span><h3>Laten we trainen!</h3><p>Ik ken veel oefeningen voor <b>Dinken, Third Shot Drops, Backhands, Opslagen en Volleys</b>. Typ een van deze woorden voor een video-les!</p>";
                videoId = "dUXwaXpID6U"; // Basis instructie video
            }

            output.innerHTML = content + "<div class='video-container'><iframe src='https://www.youtube.com/embed/" + videoId + "' frameborder='0' allowfullscreen></iframe></div>";
        }
    </script>
</body>
</html>

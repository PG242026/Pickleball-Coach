<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Coach Rick</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1599586120429-48281b6f0ece?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-attachment: fixed; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.95); padding: 30px; border-radius: 25px; max-width: 600px; margin: 20px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #bdc3c7; margin-bottom: 25px; font-size: 14px; }
        input { width: 90%; padding: 15px; border-radius: 30px; border: 2px solid #2ecc71; background: #333; color: white; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; }
        button { background: #2ecc71; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; width: 100%; }
        button:hover { background: #27ae60; transform: scale(1.02); }
        #coach-antwoord { margin-top: 30px; background: white; color: #333; padding: 20px; border-radius: 20px; text-align: left; display: none; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; margin-top: 15px; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .yt-link { display: block; margin-top: 10px; color: #2ecc71; text-decoration: none; font-size: 14px; font-weight: bold; text-align: center; }
        .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🎾 Pickleball Coach Rick</h1>
        <p class="subtitle">Video Training & Advies</p>
        
        <input type="text" id="coach-vraag" placeholder="Typ bijv. dinken, opslag of backhand">
        <br>
        <button onclick="vraagCoach()">Start Training</button>

        <div id="coach-antwoord"></div>
    </div>

    <script>
        function vraagCoach() {
            const input = document.getElementById('coach-vraag').value.toLowerCase();
            const output = document.getElementById('coach-antwoord');
            output.style.display = "block";
            
            let content = "";
            let vId = "";

            if (input.includes("dink")) {
                content = "<span class='tag'>TECHNIEK</span><h3>Dinking</h3><p>Focus op een zachte push vanuit de schouder.</p>";
                vId = "8vX_490mH3A";
            } else if (input.includes("backhand")) {
                content = "<span class='tag'>SLAGEN</span><h3>De Backhand</h3><p>Zorg voor een stabiele paddle en vroege voorbereiding.</p>";
                vId = "vYp-Xn9ZunM";
            } else if (input.includes("serve") || input.includes("opslag")) {
                content = "<span class='tag'>BASIS</span><h3>De Opslag</h3><p>Sla de bal diep in het vak van de tegenstander.</p>";
                vId = "R7NAnv99U_A";
            } else if (input.includes("drop")) {
                content = "<span class='tag'>STRATEGIE</span><h3>Third Shot Drop</h3><p>De belangrijkste bal om het net te kunnen bereiken.</p>";
                vId = "unX99u8_V6Q";
            } else {
                content = "<span class='tag'>BASIS</span><h3>Algemene Training</h3><p>Bekijk deze basisprincipes voor een beter spel.</p>";
                vId = "dUXwaXpID6U";
            }

            output.innerHTML = content + 
                "<div class='video-container'>" +
                "<iframe src='https://www.youtube.com/embed/" + vId + "?rel=0' allowfullscreen></iframe>" +
                "</div>" +
                "<a class='yt-link' href='https://www.youtube.com/watch?v=" + vId + "' target='_blank'>Video werkt niet? Klik hier om op YouTube te kijken ↗</a>";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach Online</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    padding:15px;
    text-align:center;
}

.app-card{
    background:#222;
    max-width:650px;
    margin:auto;
    margin-bottom:20px;
    padding:20px;
    border-radius:20px;
    border:2px solid #2ecc71;
}

h1{
    color:#2ecc71;
}

select,button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:30px;
    border:none;
    font-size:16px;
}

select{
    background:#333;
    color:white;
    border:2px solid #2ecc71;
}

button{
    cursor:pointer;
    font-weight:bold;
}

.btn-coach{
    background:#2ecc71;
    color:white;
}

#coach-antwoord{
    display:none;
    margin-top:15px;
    background:white;
    color:black;
    padding:20px;
    border-radius:20px;
    text-align:left;
}

.niveau{
    background:#2ecc71;
    color:white;
    padding:6px 14px;
    border-radius:20px;
    display:inline-block;
    margin-bottom:10px;
    font-weight:bold;
}

.trainer-blok{
    background:#e3f2fd;
    color:#1565c0;
    border-left:5px solid #2196f3;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.youtube-box{
    background:#111;
    color:white;
    padding:15px;
    border-radius:15px;
    margin-top:20px;
    text-align:center;
}

.youtube-box iframe{
    width:100%;
    height:260px;
    border:none;
    border-radius:15px;
    background:#000;
}

.btn-youtube{
    display:block;
    background:red;
    color:white;
    padding:15px;
    border-radius:30px;
    text-decoration:none;
    margin-top:15px;
    font-weight:bold;
}

.video-wrapper{
    background:black;
    border-radius:15px;
    overflow:hidden;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:15px;
}

video{
    width:100%;
    display:none;
}

#placeholder{
    color:#777;
}

.btn-camera{
    background:#3498db;
    color:white;
}

.btn-record{
    background:#e74c3c;
    color:white;
    display:none;
}

.btn-stop{
    background:#f1c40f;
    color:black;
    display:none;
}
</style>
</head>

<body>

<div class="app-card">
<h1>Pickleball Coach Online</h1>

<select id="niveauFilter" onchange="vulDropdown()">
    <option value="Alles">Alle niveaus</option>
    <option value="Beginner">Beginner</option>
    <option value="Gemiddeld">Gemiddeld</option>
    <option value="Gevorderd">Gevorderd</option>
</select>

<select id="coach-vraag">
    <option value="">Kies eerst een oefening</option>
</select>

<button class="btn-coach" onclick="vraagCoach()">Advies & Lesplan</button>

<div id="coach-antwoord"></div>
</div>

<div class="app-card">
<h1>Video Analyse Tool</h1>

<div class="video-wrapper">
    <div id="placeholder">Camera staat uit</div>
    <video id="preview" autoplay playsinline muted></video>
    <video id="recordedVideo" controls></video>
</div>

<button id="camBtn" class="btn-camera" onclick="toggleCamera()">📷 Camera Activeren</button>
<button id="startBtn" class="btn-record" onclick="startRecording()">🔴 Start Opname</button>
<button id="stopBtn" class="btn-stop" onclick="stopRecording()">⏹ Stop Opname</button>
</div>

function vulDropdown(){
    const niveau = document.getElementById("niveauFilter").value;
    const select = document.getElementById("coach-vraag");

    select.innerHTML = '<option value="">Kies eerst een oefening</option>';

    oefeningen.forEach((oefening,index)=>{
        if(niveau === "Alles" || oefening.niveau === niveau){
            const option = document.createElement("option");
            option.value = index;
            option.textContent = oefening.naam + " - " + oefening.niveau;
            select.appendChild(option);
        }
    });
}

function vraagCoach(){
    const index = document.getElementById("coach-vraag").value;

    if(index === ""){
        alert("Kies eerst een oefening");
        return;
    }

    const oefening = oefeningen[index];
    const output = document.getElementById("coach-antwoord");

    const zoekterm = "pickleball " + oefening.naam + " tutorial";
    const yt = "https://www.youtube.com/results?search_query=" + encodeURIComponent(zoekterm);

    output.style.display = "block";

    output.innerHTML = `
        <div class="niveau">${oefening.niveau}</div>

        <h2>${oefening.naam}</h2>

        <p><strong>Uitleg:</strong> ${oefening.uitleg}</p>
        <p><strong>Techniek:</strong> ${oefening.techniek}</p>
        <p><strong>Doel:</strong> ${oefening.doel}</p>
        <p><strong>Fysiek:</strong> ${oefening.fysiek}</p>

        <div class="trainer-blok">
            <strong>Trainerstip:</strong><br>
            Begin rustig. Let op houding, voetenwerk, balans en paddlepositie.
            Verhoog daarna langzaam het tempo.
        </div>

        <div class="trainer-blok">
            <strong>Lesopbouw:</strong><br>
            1. 5 minuten uitleg<br>
            2. 10 minuten rustig oefenen<br>
            3. 10 minuten rallyvorm<br>
            4. 5 minuten video terugkijken
        </div>

        <div class="youtube-box">
            <h3>🎥 YouTube voorbeelden</h3>
            <p>Bekijk voorbeeldvideo's voor:</p>
            <strong>${oefening.naam}</strong>

            <iframe
                src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(zoekterm)}"
                allowfullscreen>
            </iframe>

            <a href="${yt}" target="_blank" class="btn-youtube">
                ▶ Open meer voorbeelden op YouTube
            </a>
        </div>
    `;
}

vulDropdown();

let stream = null;
let recorder;
let chunks = [];

const preview = document.getElementById("preview");
const recordedVideo = document.getElementById("recordedVideo");
const camBtn = document.getElementById("camBtn");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const placeholder = document.getElementById("placeholder");

async function toggleCamera(){
    if(stream){
        stream.getTracks().forEach(track => track.stop());
        stream = null;

        preview.style.display = "none";
        recordedVideo.style.display = "none";
        placeholder.style.display = "block";

        camBtn.innerText = "📷 Camera Activeren";
        startBtn.style.display = "none";
        stopBtn.style.display = "none";
    } else {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:false
            });

            preview.srcObject = stream;
            preview.style.display = "block";
            recordedVideo.style.display = "none";
            placeholder.style.display = "none";

            camBtn.innerText = "🔌 Camera Deactiveren";
            startBtn.style.display = "block";
        } catch(err){
            alert("Camera toegang geweigerd. Controleer je browserrechten.");
        }
    }
}

function startRecording(){
    if(!stream){
        alert("Zet eerst de camera aan.");
        return;
    }

    chunks = [];
    let options = {};

    if(MediaRecorder.isTypeSupported("video/webm")){
        options = {mimeType:"video/webm"};
    }

    recorder = new MediaRecorder(stream, options);

    recorder.ondataavailable = e => {
        if(e.data.size > 0){
            chunks.push(e.data);
        }
    };

    recorder.onstop = () => {
        const blob = new Blob(chunks, {
            type: recorder.mimeType || "video/webm"
        });

        recordedVideo.src = URL.createObjectURL(blob);

        preview.style.display = "none";
        recordedVideo.style.display = "block";
    };

    recorder.start();

    startBtn.style.display = "none";
    stopBtn.style.display = "block";
}

function stopRecording(){
    if(recorder && recorder.state !== "inactive"){
        recorder.stop();
    }

    startBtn.style.display = "block";
    stopBtn.style.display = "none";
}
</script>

</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Coach Online</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-attachment: fixed; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.95); padding: 30px; border-radius: 25px; max-width: 600px; margin: 20px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
        .subtitle { color: #bdc3c7; margin-bottom: 25px; font-size: 14px; }
        input { width: 90%; padding: 15px; border-radius: 30px; border: 2px solid #2ecc71; background: #333; color: white; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; box-sizing: border-box; }
        .btn-coach { background: #2ecc71; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; width: 100%; margin-bottom: 10px; text-transform: uppercase; }
        .btn-reset { background: #555; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; margin-top: 15px; transition: 0.3s; }
        .btn-youtube { background: #ff0000; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; width: 100%; text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center; margin-bottom: 10px; }
        .btn-coach:hover, .btn-youtube:hover { opacity: 0.8; transform: scale(1.02); }
        
        /* De antwoord-boxen */
        #coach-antwoord { margin-top: 30px; background: white; color: #333; padding: 25px; border-radius: 20px; text-align: left; display: none; border-bottom: 5px solid #2ecc71; }
        .trainer-blok { background: #e3f2fd; border-left: 5px solid #2196f3; padding: 15px; margin-top: 20px; border-radius: 10px; color: #1565c0; }
        .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .tag-trainer { background: #bbdefb; color: #0d47a1; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>Pickleball Coach Online</h1>
        <p class="subtitle">Tactiek voor spelers & Protocollen voor trainers</p>
        
        <input type="text" id="coach-vraag" placeholder="Welke slag gaan we trainen?" onkeypress="checkEnter(event)">
        <br>
        <button class="btn-coach" onclick="vraagCoach()">Genereer Lesplan</button>

        <div id="coach-antwoord"></div>
        <button id="reset-button" class="btn-reset" style="display:none;" onclick="resetApp()">Wissen</button>
    </div>

    <script>
        function checkEnter(event) { if (event.key === "Enter") { vraagCoach(); } }

        function vraagCoach() {
            const inputField = document.getElementById('coach-vraag');
            const input = inputField.value;
            const output = document.getElementById('coach-antwoord');
            const resetBtn = document.getElementById('reset-button');
            
            if(!input) return alert("Typ een slag in (bijv. Dink of Serve)");

            output.style.display = "block";
            resetBtn.style.display = "inline-block";
            
            const zoekTerm = "pickleball " + input + " drill for coaches";
            const ytLink = "https://www.youtube.com/results?search_query=" + encodeURIComponent(zoekTerm);

            let spelerTip = "";
            let trainerPlan = "";
            let laagInput = input.toLowerCase();
            
            if (laagInput.includes("dink")) {
                spelerTip = "Focus op een zachte 'push'. Houd je pols stijf en beweeg vanuit je schouder. Blijf laag en raak de bal voor je lichaam.";
                trainerPlan = "<strong>Drill:</strong> Laat spelers recht tegenover elkaar staan bij de NVZ-lijn. Gebruik één bal. Focus: 20 dinks achter elkaar zonder fouten. Daarna verplaatsen naar diagonaal dinken.";
            } else if (laagInput.includes("opslag") || laagInput.includes("serve")) {
                spelerTip = "Zorg voor een volledige doorzwaai. Mik op de achterste 1 meter van het vak om de tegenstander diep te houden.";
                trainerPlan = "<strong>Drill:</strong> Plaats targets (pilonnen) in de achterhoeken. Laat spelers 10 serves doen. 1 punt per target-hit. Let op de onderhandse beweging!";
            } else if (laagInput.includes("lob")) {
                spelerTip = "De lob is een verdedigend wapen. Gebruik de breedte van je paddle om de bal een hoge boog te geven, over de tegenstander heen.";
                trainerPlan = "<strong>Drill:</strong> Trainer staat aan het net, leerling achterin. Leerling moet de bal over de trainer heen lobben zodat deze binnen de baseline valt. Let op voetenwerk bij het achteruitlopen.";
            } else {
                spelerTip = "Voor " + input + " is een vroege voorbereiding cruciaal. Houd je paddle omhoog en je ogen op de bal.";
                trainerPlan = "<strong>Drill:</strong> Start met een warming-up van 5 minuten specifiek voor " + input + ". Bouw de intensiteit op van statisch naar bewegend over de hele baan.";
            }

            output.innerHTML = `
                <span class="tag">Speler Advies</span>
                <p>${spelerTip}</p>
                
                <div class="trainer-blok">
                    <span class="tag tag-trainer">Trainers Protocol</span><br>
                    ${trainerPlan}
                </div>
                
                <hr>
                <a href="${ytLink}" target="_blank" class="btn-youtube">▶ Bekijk Trainers Video's</a>
            `;
            
            inputField.value = "";
            inputField.blur();
        }

        function resetApp() {
            document.getElementById('coach-antwoord').style.display = "none";
            document.getElementById('reset-button').style.display = "none";
        }
    </script>
</body>
</html>

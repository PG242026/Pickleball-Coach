<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Coach</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#1f5f3b;font-family:Arial,Helvetica,sans-serif}#status{position:fixed;inset:auto 16px 16px 16px;z-index:2;background:white;color:#1f5f3b;border-radius:12px;padding:12px 14px;text-align:center;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.18)}#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#1f5f3b}
</style>
</head>
<body>
<div id="status">Pickleball Coach laden...</div>
<iframe id="appFrame" src="/index.html?coach=v17" allow="camera; microphone; fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('appFrame');
  const status=document.getElementById('status');
  const languageText={nl:{sent:'Uw feedback is verzonden.',saved:'🌍 Taal opgeslagen',empty:'⚠️ Typ eerst je feedback'},en:{sent:'Your feedback has been sent.',saved:'🌍 Language saved',empty:'⚠️ Please type your feedback first'},de:{sent:'Ihr Feedback wurde gesendet.',saved:'🌍 Sprache gespeichert',empty:'⚠️ Bitte zuerst Feedback eingeben'},es:{sent:'Sus comentarios han sido enviados.',saved:'🌍 Idioma guardado',empty:'⚠️ Escribe primero tu comentario'},fr:{sent:'Votre feedback a été envoyé.',saved:'🌍 Langue enregistrée',empty:'⚠️ Écrivez d’abord votre feedback'}};
  function currentLang(){return localStorage.getItem('pickleballTaal')||'nl'}
  function text(){return languageText[currentLang()]||languageText.nl}
  function showMessage(message){try{frame.contentWindow.toonMelding(message);return}catch(e){}status.textContent=message;status.style.display='block';setTimeout(()=>status.style.display='none',3500)}
  function closePopups(doc){doc.querySelectorAll('.popup').forEach(p=>p.style.display='none');const bg=doc.getElementById('popupAchtergrond');if(bg)bg.style.display='none'}
  function openPopup(doc,id){closePopups(doc);const bg=doc.getElementById('popupAchtergrond'),popup=doc.getElementById(id);if(bg)bg.style.display='block';if(popup)popup.style.display='block'}
  function injectStyle(doc){
    if(doc.getElementById('coach-direct-fixes'))return;
    const style=doc.createElement('style');
    style.id='coach-direct-fixes';
    style.textContent=`
      .pwa-debug,#pwaDebugPane{display:none!important}
      .video-grid,.video-layout,.side-by-side-container{align-items:start!important}
      .player-video-separator{display:block!important;border:0!important;border-top:1px solid #b9d2c3!important;margin:28px 0 14px!important;width:100%!important}
      .youtube-panel-actions{display:flex!important;flex-wrap:wrap!important;gap:10px!important;align-items:center!important;margin:10px 0 0!important}
      .youtube-panel-actions button{margin:0!important;min-height:46px!important;padding:13px 18px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}
      .youtube-compare-panel{display:block!important;width:100%!important;box-sizing:border-box!important;clear:both!important;background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin-top:18px!important}
      .youtube-compare-panel.coach-paid-divider{border-top:1px solid #b9d2c3!important;padding-top:14px!important}
      .youtube-compare-panel .sync-accordion{display:block!important;background:#f7fcf9!important;border:1px solid #d2e7db!important;border-radius:12px!important;overflow:hidden!important;margin:0!important}
      .youtube-compare-panel details{display:block!important;margin:0!important}
      .youtube-compare-panel details>.sync-paneel{display:block!important;max-height:none!important;overflow:visible!important;padding:4px 14px 14px!important}
      .youtube-compare-panel .sync-groep{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin-top:10px!important}
      .youtube-compare-panel .sync-groep button{display:flex!important;width:100%!important;margin:0!important;justify-content:flex-start!important;text-align:left!important}
      .player-analysis-outside{width:100%!important;box-sizing:border-box!important;margin-top:14px!important;border-top:1px solid #b9d2c3!important;padding-top:14px!important}
      .video-analyse-sectie .video-analysis-paneel{display:block!important}
      .video-analyse-sectie .analyse-controls,.video-analyse-sectie .sessie-sectie{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:10px!important}
      .video-analyse-sectie .help-pair{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;margin:0!important;width:auto!important;max-width:100%!important}
      .video-analyse-sectie .help-pair>button:not(.help-icon){margin:0!important}
      .video-analyse-sectie .help-pair>.help-icon{position:static!important;display:inline-flex!important;flex:0 0 28px!important;width:28px!important;height:28px!important;min-height:28px!important;margin:0!important;padding:0!important}
      .video-analyse-sectie .analyse-controls>button:not(.help-icon),.video-analyse-sectie .sessie-sectie>button:not(.help-icon){display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;text-align:left!important;margin:0!important;width:auto!important;max-width:100%!important}
      .video-analyse-sectie .momenten-sectie{margin-top:14px!important}
      .video-analyse-sectie .momenten-sectie button{display:inline-flex!important;justify-content:flex-start!important;text-align:left!important;margin-left:0!important}
      .coach-help-tip{position:absolute!important;background:#133e27!important;color:#fff!important;padding:9px 11px!important;border-radius:8px!important;font-size:14px!important;line-height:1.35!important;max-width:280px!important;z-index:2147483647!important;box-shadow:0 6px 18px rgba(0,0,0,.25)!important;text-align:left!important}
      @media(max-width:760px){.youtube-panel-actions button{width:auto!important}.youtube-compare-panel,.player-analysis-outside{margin-top:14px!important}}
    `;
    doc.head.appendChild(style);
  }
  function pairHelpButtons(doc){doc.querySelectorAll('.video-analyse-sectie .help-icon').forEach(help=>{if(help.parentElement&&help.parentElement.classList.contains('help-pair'))return;const prev=help.previousElementSibling;if(!prev||prev.classList.contains('help-icon'))return;const pair=doc.createElement('span');pair.className='help-pair';prev.parentNode.insertBefore(pair,prev);pair.appendChild(prev);pair.appendChild(help)})}
  function languageFromButton(button,action){const m=action.match(/setTaal\('([^']+)'\)/);if(m)return m[1];const label=(button.textContent||'').toLowerCase();if(label.includes('nederlands'))return'nl';if(label.includes('english'))return'en';if(label.includes('deutsch'))return'de';if(label.includes('español')||label.includes('espanol'))return'es';if(label.includes('français')||label.includes('francais'))return'fr';return''}
  function setLanguage(doc,lang){localStorage.setItem('pickleballTaal',lang);try{frame.contentWindow.localStorage.setItem('pickleballTaal',lang);if(typeof frame.contentWindow.setTaal==='function')frame.contentWindow.setTaal(lang)}catch(e){}closePopups(doc);showMessage((languageText[lang]||languageText.nl).saved)}
  function sendFeedback(doc){const naam=doc.getElementById('feedbackNaam'),soort=doc.getElementById('feedbackSoort'),bericht=doc.getElementById('feedbackBericht');const message=(bericht&&bericht.value||'').trim();if(!message){showMessage(text().empty);return}const subject=encodeURIComponent('Feedback Pickleball Coach AI - '+((soort&&soort.value)||'Feedback'));const body=encodeURIComponent('Naam: '+((naam&&naam.value)||'Onbekend')+'\nSoort: '+((soort&&soort.value)||'Feedback')+'\nDatum: '+new Date().toLocaleString('nl-NL')+'\n\nFeedback:\n'+message);if(naam)naam.value='';if(bericht)bericht.value='';if(soort)soort.selectedIndex=0;closePopups(doc);sessionStorage.setItem('pickleballFeedbackBedankt','1');window.location.href='mailto:hcvsabben@gmail.com?subject='+subject+'&body='+body}
  function showPendingFeedbackThanks(){if(sessionStorage.getItem('pickleballFeedbackBedankt')!=='1')return;sessionStorage.removeItem('pickleballFeedbackBedankt');showMessage(text().sent)}
  window.addEventListener('focus',()=>setTimeout(showPendingFeedbackThanks,250));
  window.addEventListener('pageshow',()=>setTimeout(showPendingFeedbackThanks,250));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(showPendingFeedbackThanks,250)});
  function installClicks(doc){if(doc.defaultView.__coachDirectClicksInstalled)return;doc.defaultView.__coachDirectClicksInstalled=true;doc.addEventListener('click',event=>{const old=doc.getElementById('coachHelpTip');if(old)old.remove();const help=event.target.closest&&event.target.closest('.help-icon');if(help){event.preventDefault();event.stopPropagation();const tip=doc.createElement('div');tip.id='coachHelpTip';tip.className='coach-help-tip';tip.textContent=help.getAttribute('data-help')||help.getAttribute('aria-label')||'Uitleg volgt later.';doc.body.appendChild(tip);const r=help.getBoundingClientRect();tip.style.left=Math.max(8,r.left+doc.defaultView.scrollX)+'px';tip.style.top=(r.bottom+8+doc.defaultView.scrollY)+'px';return}const button=event.target.closest&&event.target.closest('button');if(!button)return;const action=button.getAttribute('onclick')||'',lang=languageFromButton(button,action);if(lang){event.preventDefault();event.stopPropagation();setLanguage(doc,lang);return}if(action.includes('openHandleiding')){event.preventDefault();event.stopPropagation();try{frame.contentWindow.renderHandleiding()}catch(e){}openPopup(doc,'handleidingPopup');return}if(action.includes('openTaal')){event.preventDefault();event.stopPropagation();openPopup(doc,'taalPopup');return}if(action.includes('openFeedback')){event.preventDefault();event.stopPropagation();openPopup(doc,'feedbackPopup');return}if(action.includes('verstuurFeedback')){event.preventDefault();event.stopPropagation();sendFeedback(doc);return}if(action.includes('sluitAllePopups')){event.preventDefault();event.stopPropagation();closePopups(doc)}},true)}
  function fixFrame(){const doc=frame.contentDocument;if(!doc)return false;injectStyle(doc);installClicks(doc);const debug=doc.getElementById('pwaDebugPane');if(debug)debug.style.display='none';const youtubeTitle=doc.getElementById('youtubeVideoTitle'),youtubeBox=youtubeTitle&&youtubeTitle.closest('.video-box');if(!youtubeBox)return false;const actionRow=youtubeBox.querySelector('.knopgroep,.youtube-panel-actions');if(!actionRow)return false;actionRow.classList.add('youtube-panel-actions');const compare=doc.querySelector('.in-youtube-panel')||doc.querySelector('.in-manage-videos')||doc.querySelector('.sync-box');if(compare){compare.classList.add('youtube-compare-panel','in-youtube-panel','coach-paid-divider');compare.classList.remove('in-manage-videos','sync-box');actionRow.insertAdjacentElement('afterend',compare);const details=compare.querySelector('details');if(details){details.open=true;details.setAttribute('open','open')}const paneel=compare.querySelector('.sync-paneel');if(paneel){paneel.style.maxHeight='none';paneel.style.overflow='visible';paneel.style.padding='4px 14px 14px'}}const analysis=doc.querySelector('.video-analyse-sectie'),manage=doc.getElementById('manageVideosAccordion');if(analysis&&manage){analysis.classList.add('player-analysis-outside');manage.insertAdjacentElement('afterend',analysis);pairHelpButtons(doc)}showPendingFeedbackThanks();status.style.display='none';return !!youtubeBox}
  frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;const ok=fixFrame();if(ok||tries>50)clearInterval(timer);if(tries>50)status.textContent='App geladen. Vernieuw de pagina als de layout nog oud is.'},250)})
})();
</script>
</body>
</html>

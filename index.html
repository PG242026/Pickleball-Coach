<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro Coach Rick</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1599586120429-48281b6f0ece?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-attachment: fixed; color: white; text-align: center; padding: 20px; margin: 0;
        }
        .app-card { background: rgba(30, 30, 30, 0.95); padding: 30px; border-radius: 25px; max-width: 600px; margin: 20px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 2px solid #2ecc71; }
        h1 { color: #2ecc71; text-transform: uppercase; margin-bottom: 5px; font-size: 24px; }
        input { width: 90%; padding: 15px; border-radius: 30px; border: 2px solid #2ecc71; background: #333; color: white; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; }
        .btn-coach { background: #2ecc71; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; width: 100%; margin-bottom: 10px; }
        .btn-youtube { background: #ff0000; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; width: 100%; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn-coach:hover, .btn-youtube:hover { opacity: 0.8; transform: scale(1.02); }
        #coach-antwoord { margin-top: 30px; background: white; color: #333; padding: 25px; border-radius: 20px; text-align: left; display: none; }
        .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🎾 Coach Rick Online</h1>
        <p>Wat gaan we vandaag perfectioneren?</p>
        
        <input type="text" id="coach-vraag" placeholder="bijv. dinken, lob, smash...">
        <br>
        <button class="btn-coach" onclick="vraagCoach()">Vraag Advies</button>

        <div id="coach-antwoord"></div>
    </div>

    <script>
        function vraagCoach() {
            const input = document.getElementById('coach-vraag').value;
            const output = document.getElementById('coach-antwoord');
            if(!input) return alert("Typ eerst even wat je wilt leren!");

            output.style.display = "block";
            
            // Zoekterm voor YouTube maken
            const zoekTerm = "pickleball " + input + " tutorial";
            const ytLink = "https://www.youtube.com/results?search_query=" + encodeURIComponent(zoekTerm);

            let advies = "";
            if (input.toLowerCase().includes("dink")) {
                advies = "Focus op een zachte push vanuit de schouder. Blijf laag en houd je paddle voor je.";
            } else if (input.toLowerCase().includes("opslag")) {
                advies = "Sla de bal diep en probeer de backhand van de tegenstander te raken.";
            } else {
                advies = "Goede focus! Voor " + input + " is balans en voetenwerk het allerbelangrijkst.";
            }

            output.innerHTML = `
                <span class="tag">TRAININGSTIP</span>
                <h3>Advies voor ${input}</h3>
                <p>${advies}</p>
                <hr>
                <p>Bekijk de beste video-instructies voor <b>${input}</b> direct op YouTube:</p>
                <a href="${ytLink}" target="_blank" class="btn-youtube">▶ Bekijk Video's op YouTube</a>
            `;
        }
    </script>
</body>
</html>

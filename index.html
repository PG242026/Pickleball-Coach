<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro 🎾</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f0fdf4; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; }
        h1 { color: #166534; }
        input { padding: 10px; width: 80%; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { background-color: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #16a34a; }
        #antwoord { margin-top: 20px; font-weight: bold; color: #374151; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pickleball Pro 🎾</h1>
        <p>Stel een vraag over je techniek of tactiek:</p>
        <input type="text" id="vraag" placeholder="Bijv: Hoe verbeter ik mijn dink?">
        <br>
        <button onclick="geefAdvies()">Vraag Advies</button>
        <div id="antwoord"></div>
    </div>

    <script>
        function geefAdvies() {
            const vraag = document.getElementById('vraag').value.toLowerCase();
            const antwoordDiv = document.getElementById('antwoord');
            
            let advies = "Interessante vraag! Focus op je voetenwerk en houd je racket laag.";
            
            if (vraag.includes("dink")) {
                advies = "Focus op een zachte beweging vanuit je schouder, niet je pols! ✨";
            } else if (vraag.includes("serve") || vraag.includes("opslag")) {
                advies = "Zorg voor een diepe bal in het achterveld en blijf achter de basislijn. 🚀";
            } else if (vraag.includes("smashen")) {
                advies = "Wacht tot de bal op het hoogste punt is en sla hem met een neerwaartse hoek! 💥";
            }
            
            antwoordDiv.innerText = advies;
        }
    </script>

</body>
</html>
